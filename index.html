<body>
    <h1>Registartion form                                                          
    <form
  <table>

    <label>Enter Your Name:</label> <input type="text" name="unname"><br><br>
    <label>Enter Father Name:</label> <input type="text" name="fname"><br><br>
    <label>Enter Mother Name:</label> <input type="text" name="mname"><br><br>
    <label>Enter Mobile Number:</label> <input type="number" name="mobile"><br><br>
    <label>Enter Your Email id: </label> <input type="email" name="mail"><br><br>
    <label>Enter Your Address:</label> <textarea name="address"></textarea><br><br>
    <label>Enter Your Gender:</label>
    <input type="radio" name="gender" value="female"> female
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="other"> Other <br><br>
    <label>Select Your hobbies:</label><br>
    <input type="checkbox" name="hobbies" value="reading"> Reading
    <input type="checkbox" name="hobbies" value="writing"> Writing
    <input type="checkbox" name="hobbies" value="swimming"> Swimming
    <label><br><br>Select Your Country:</label>
    <select name="country">
        <option value="india">India</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
        <option value="australia">Australia</option>
    </select><br><br>
    <label>Select Your state:</label>
    <select name="state">
        <option value="maharashtra">Maharashtra</option>
        <option value="gujarat">Gujarat</option>
        <option value="rajasthan">Rajasthan</option>
        <option value="punjab">Punjab</option>
    </select><br><br>
    <label>Enter Your Password</label><input type="password" name="pwd"><br><br>
